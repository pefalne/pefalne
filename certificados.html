  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    // List of certificates
    const certs = [
      "Bootcamps DIO - Desafios de Código",
      "Bootcamps DIO - Educação e Empregabilidade",
      "Bootcamps DIO - Educação",
      "Bootcamps DIO - Logico e Pensamento Computacional",
      "CPQ - Básico - Universidade Ploomes",
      "CPQ - Design de Documentos - Universidade Ploomes",
      "Certificado - Administrando Bancos de Dados - Fundação Bradesco",
      "Certificado - Atendimento ao Publico - Fundação Bradesco",
      "Certificado - Azure - Escola do Trabalhador",
      "Certificado - Desenvolvimento de Sistemas Web - CSS e HTML - FGV",
      "Certificado - Dev Start - TOTVS",
      "Certificado - Fluig Express - TOTVS",
      "Certificado - Gestão Ágil com Scrum - UDEMY",
      "Certificado - Implementando Banco de Dados - Fundação Bradesco",
      "Certificado - Informática Básica - MUNDI IFSUL",
      "Certificado - Introdução ao Git e GitHub - FGV",
      "Certificado - Introdução à Inteligência Artificial - FGV",
      "Certificado - Introdução à Programação Orientada a POO - Fundação Bradesco",
      "Certificado - Modelagem de Dados - Fundação Bradesco",
      "Certificado - Outras Ferramentas para Uso Didático - Ampliando as Possibilidades da IA em Sala de Aula - FGV",
      "Certificado - Princípios da Ética na Era da Inteligência Artificial - FGV",
      "Certificado - Segurança Digital - FGV",
      "Certificado - Soft Skills - Prime Cursos",
      "Certificado - Ética em IA - ENAP",
      "Certificado Cisco - Exploring IoT with Cisco Packet Tracer",
      "Certificado Cisco - Exploring Networking with Cisco Packet Tracer",
      "Certificado Cisco - Getting Started with Cisco Packet Tracer",
      "Certificado LGPD - Fundação Bradesco",
      "Importação de Clientes e Contatos - Universidade Ploomes",
      "Integração - Clicksign - Universidade Ploomes",
      "Integração - Facebook Lead Ads - Universidade Ploomes",
      "Integração - Whatsapp - Universidade Ploomes",
      "Seminário de Gestão do Agreste II - IEL",
      "Usabilidade Geral - Mobile - Universidade Ploomes",
      "Usabilidade Geral - Web - Universidade Ploomes"
    ];

    const container = document.getElementById('certificados-container');
    
    // Set up PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const card = entry.target;
          const cert = card.dataset.cert;
          const wrapperId = card.dataset.wrapperId;
          
          if (!cert) return;
          
          // Stop observing this element so we only load it once
          obs.unobserve(card);
          
          const url = `Certificados/${encodeURIComponent(cert)}.pdf`;
          
          // Load PDF
          pdfjsLib.getDocument(url).promise.then(pdf => {
            return pdf.getPage(1);
          }).then(page => {
            const viewport = page.getViewport({ scale: 1.0 });
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Calculate scale to fit width
            const desiredWidth = 400;
            const scale = desiredWidth / viewport.width;
            const scaledViewport = page.getViewport({ scale: scale });
            
            canvas.width = scaledViewport.width;
            canvas.height = scaledViewport.height;
            
            // Anti-download styles for canvas
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.objectFit = 'cover';
            canvas.style.objectPosition = 'top';
            canvas.style.pointerEvents = 'none';
            
            const renderContext = {
              canvasContext: ctx,
              viewport: scaledViewport
            };
            
            page.render(renderContext).promise.then(() => {
              const wrapper = document.getElementById(wrapperId);
              if(wrapper) {
                wrapper.innerHTML = '';
                wrapper.appendChild(canvas);
              }
            });
          }).catch(err => {
            console.error('Error loading PDF ' + cert, err);
            const wrapper = document.getElementById(wrapperId);
            if(wrapper) {
              wrapper.innerHTML = '<div style="color: red; padding: 20px; text-align: center;">Erro ao carregar</div>';
            }
          });
        }
      });
    }, {
      rootMargin: '100px 0px', // Load slightly before it comes into view
      threshold: 0.1
    });

    certs.forEach((cert) => {
      const card = document.createElement('div');
      card.className = 'certificado-card gsap-fade-up';
      
      const cleanName = cert.replace('Certificado - ', '').replace('.pdf', '');
      const wrapperId = `wrapper-${cleanName.replace(/\s+/g, '-').replace(/[^a-zA-Z0-9-]/g, '')}`;
      
      card.dataset.cert = cert;
      card.dataset.wrapperId = wrapperId;
      
      card.innerHTML = `
        <div class="certificado-img-wrapper" id="${wrapperId}">
          <div class="loading-spinner" style="padding: 20px; color: var(--text-muted); font-size: 0.9rem;">Carregando...</div>
        </div>
        <div class="certificado-info">
          <h3>${cleanName}</h3>
        </div>
      `;
      container.appendChild(card);
      
      // Observe the card for lazy loading
      observer.observe(card);
    });
  </script>
